name: Food codes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: true
      - name: Probe
        env:
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
        run: python3 scripts/food_codes.py
      - name: Commit result
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/food_codes.json
          git diff --cached --quiet || (git commit -m "음식점 분류 코드 확인 결과" && git push origin HEAD:main)
