name: Geocode trails

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/trails_source.json'
      - 'scripts/geocode_trails.py'

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Geocode start points (Kakao Local API)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python3 scripts/geocode_trails.py
      - name: Commit if changed
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trails.json
          git diff --cached --quiet || (git commit -m "둘레길 좌표 갱신 $(date -u +%F)" && git push)
