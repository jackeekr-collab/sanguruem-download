name: Update forest info

on:
  schedule:
    - cron: '30 19 * * 1'   # 매주 월요일 04:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch forest info (산림청 명산등산로)
        env:
          FOREST_API_KEY: ${{ secrets.FOREST_API_KEY }}
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
          FOREST_API_BASE: ${{ secrets.FOREST_API_BASE }}   # 비어 있으면 기본 주소 사용
        run: python3 scripts/fetch_forest.py
      - name: Commit if changed
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add forest.json
          git diff --cached --quiet || (git commit -m "산림청 명산 정보 갱신 $(date -u +%F)" && git push)
