name: Forest API probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/forest_probe.py
      - name: Commit result
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/forest_all.json
          git diff --cached --quiet || (git commit -m "산림청 API 시험 호출 결과" && git push origin HEAD:main)
