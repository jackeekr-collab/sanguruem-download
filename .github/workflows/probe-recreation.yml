name: Probe recreation API (임시)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 휴양림 API 항목 확인
        env:
          RECREATION_API_KEY: ${{ secrets.RECREATION_API_KEY }}
          FOREST_API_KEY: ${{ secrets.FOREST_API_KEY }}
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
        run: python3 scripts/probe_recreation.py
