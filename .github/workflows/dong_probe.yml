name: Dong probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: true
      - name: Probe
        env:
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
        run: python3 scripts/dong_probe.py
      - name: Commit result
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/dong_probe.json
          git diff --cached --quiet || (git commit -m "동 자료 확인" && git push origin HEAD:main)
