name: Dong build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: true
      - name: Probe
        run: python3 scripts/dong_build.py
      - name: Commit result
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dong.json scripts/dong_build_report.json
          git diff --cached --quiet || (git commit -m "dong.json 생성" && git push origin HEAD:main)
