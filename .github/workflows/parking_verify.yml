name: Parking verify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Find parking candidates (Kakao Local API)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python3 scripts/parking_verify.py
      - name: Commit result
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/parking_verify.json
          git diff --cached --quiet || (git commit -m "주차장 확인 $(date -u +%F)" && git push origin HEAD:main)
