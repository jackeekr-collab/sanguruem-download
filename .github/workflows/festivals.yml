name: Update festivals

on:
  schedule:
    - cron: '17 20 * * *'   # 매일 05:17 KST
    - cron: '17 8 * * *'    # 매일 17:17 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 연결 진단 (임시)
        continue-on-error: true
        run: |
          for u in https://apis.data.go.kr/ http://apis.data.go.kr/ https://www.data.go.kr/; do
            echo "== $u"; curl -sS -m 20 -o /dev/null -w "code=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" "$u" || true
          done
          getent hosts apis.data.go.kr || true
      - name: Fetch festivals from KTO
        env:
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
        run: python3 scripts/fetch_festivals.py
      - name: Commit if changed
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add festivals.json
          git diff --cached --quiet || (git commit -m "축제 데이터 갱신 $(date -u +%F)" && git push)
