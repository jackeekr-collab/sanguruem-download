name: Address lookup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/addr_source.json'
      - 'scripts/addr_lookup.py'

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Address to coordinates (Kakao Local API)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python3 scripts/addr_lookup.py
      - name: Commit result
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/addr_result.json
          git diff --cached --quiet || (git commit -m "주소 좌표 $(date -u +%F)" && git pull --rebase origin main && git push origin HEAD:main)
