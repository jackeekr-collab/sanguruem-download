name: Food build
on:
  schedule:
    - cron: '50 19 4 * *'   # 매월 5일 04:50 KST (UTC 4일 19:50)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: true
      - name: Probe
        env:
          KTO_API_KEY: ${{ secrets.KTO_API_KEY }}
        run: python3 scripts/food_build.py
      - name: Commit result
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add food.json scripts/food_build_report.json
          git diff --cached --quiet || (git commit -m "food.json 생성" && git push origin HEAD:main)
