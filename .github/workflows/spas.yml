name: Geocode spas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/spas_source.json'
      - 'scripts/geocode_spas.py'

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Geocode addresses (Kakao Local API)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python3 scripts/geocode_spas.py
      - name: Commit if changed
        run: |
          git config user.name "sanguruem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add spas.json
          git diff --cached --quiet || (git commit -m "온천·찜질방 좌표 갱신 $(date -u +%F)" && git push)
